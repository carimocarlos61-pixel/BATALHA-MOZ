name: BATALHA-MOZ quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s style.css
          test -s game.js
          test -s render.yaml
          grep -q 'id="scene"' index.html
          grep -q 'function animate' game.js
